[package]
name = "rates"
version = "0.1.0"
edition = "2021"
description = "Exchange rates from the Central Bank of Uzbekistan, with a converter"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
