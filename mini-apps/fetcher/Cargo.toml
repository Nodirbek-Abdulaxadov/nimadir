[package]
name = "fetcher"
version = "0.1.0"
edition = "2021"
description = "Test fixture: fetch what is typed, show what came back"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60.0"
# wit-bindgen version is filled in by `cargo add` (latest on crates.io).

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
