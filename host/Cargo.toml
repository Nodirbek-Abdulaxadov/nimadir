[package]
name = "host"
version = "0.1.0"
edition = "2021"
description = "Native app shell that runs sandboxed WASM component mini-apps, no web stack"

[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
# `component-model` enables `wasmtime::component` (bindgen!, Component, Linker).
wasmtime = { version = "47", features = ["component-model"] }
anyhow = "1"
ureq = "2"
# The registry catalogue. JSON is what a registry server would serve, so the
# same parser reads a local file and a remote one.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime-wasi = "47"
# Where config, data and caches live on each platform (`paths.rs`).
dirs = "6"
# Registry pins: a component's SHA-256 is checked before it is compiled.
sha2 = "0.10"
# `image-load`: PNG and JPEG, decoded on the host. Pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# What a component says about itself, and who signed it (ADR-1).
nimadir-manifest = { path = "../crates/manifest" }
# The webview (module 1). Only `wry` — NOT Tauri: Tauri brings its own
# application framework, which would fight the host loop nimadir already owns.
wry = { version = "0.56", optional = true }

# The window (`gui`). Default features on the desktop. On Android: no X11 or
# Wayland, and no `accesskit`, which eframe refuses to combine with
# NativeActivity — see docs/spikes/android.md.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.35", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.35", optional = true, default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
# Only to name `AndroidApp`, which eframe takes but does not re-export. The
# version eframe already uses.
winit = { version = "0.30", optional = true, features = ["android-native-activity"] }
# To read the window insets (`android.rs`), which winit does not report.
jni = { version = "0.21", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux wry is WebKitGTK, which lives in GTK's event loop; the host has to
# initialise and pump it (see webview.rs). Pinned to the version wry itself
# uses, so both sides mean the same GTK.
gtk = { version = "0.18", optional = true }

[features]
# Headless is the default so the shell builds and runs ANYWHERE (no system GUI
# libraries needed) and can be verified in CI. The real native window is the
# `gui` feature: `cargo run --features gui -- <app.wasm>`.
default = []
gui = ["dep:eframe", "dep:winit", "dep:jni"]
# Kept separate from `gui` because it needs system libraries that `gui` does
# not: WebKitGTK on Linux (libwebkit2gtk-4.1-dev), WebView2 on Windows. Folding
# it into `gui` would make the windowed build stop working on machines that
# have no webview runtime, to add a module they may never open.
webview = ["gui", "dep:wry", "dep:gtk"]
