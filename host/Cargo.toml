[package]
name = "host"
version = "1.0.0-beta.1"
edition = "2021"
description = "Native app shell that runs sandboxed WASM component mini-apps, no web stack"

# Installed as `nimadir-shell`: `host` is taken on Linux (the DNS tool in
# /usr/bin), and the package keeps its name, so `cargo run -p host` still works.
[[bin]]
name = "nimadir-shell"
path = "src/main.rs"

[dependencies]
# `component-model` enables `wasmtime::component` (bindgen!, Component, Linker).
wasmtime = { version = "47", features = ["component-model"] }
anyhow = "1"
ureq = "2"
# The registry catalogue. JSON is what a registry server would serve, so the
# same parser reads a local file and a remote one.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime-wasi = "47"
# Where config, data and caches live on each platform (`paths.rs`).
dirs = "6"
# Registry pins: a component's SHA-256 is checked before it is compiled.
sha2 = "0.10"
# `image-load`: PNG and JPEG, decoded on the host. Pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# What a component says about itself, and who signed it (ADR-1).
nimadir-manifest = { path = "../crates/manifest" }
# The webview (module 1). Only `wry` — NOT Tauri: Tauri brings its own
# application framework, which would fight the host loop nimadir already owns.
wry = { version = "0.56", optional = true }
# The element tree's layout (ADR-4): block, flex, grid, floats. Pure Rust,
# so the headless default keeps building anywhere.
taffy = "0.15"

# The window (`gui`). Default features on the desktop. On Android: no X11 or
# Wayland, and no `accesskit`, which eframe refuses to combine with
# NativeActivity — see docs/spikes/android.md.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.35", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.35", optional = true, default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
# Only to name `AndroidApp`, which eframe takes but does not re-export. The
# version eframe already uses.
winit = { version = "0.30", optional = true, features = ["android-native-activity"] }
# To read the window insets (`android.rs`), which winit does not report.
jni = { version = "0.21", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux wry is WebKitGTK, which lives in GTK's event loop; the host has to
# initialise and pump it (see webview.rs). Pinned to the version wry itself
# uses, so both sides mean the same GTK.
gtk = { version = "0.18", optional = true }
# The desktop's dark-mode preference, from the XDG portal (portal.rs): winit
# reports no theme on Linux. Already in the window build through accesskit,
# with these features, so it adds nothing.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }
# Only to ask for X11 when the window may hold a webview (gui.rs, `run`): a
# child webview cannot attach to a Wayland surface. The version eframe uses.
winit = { version = "0.30", optional = true, default-features = false, features = ["x11"] }

[features]
# Headless is the default so the shell builds and runs ANYWHERE (no system GUI
# libraries needed) and can be verified in CI. The real native window is the
# `gui` feature: `cargo run --features gui -- <app.wasm>`.
default = []
gui = ["dep:eframe", "dep:winit", "dep:jni", "dep:zbus"]
# Kept separate from `gui` because it needs system libraries that `gui` does
# not: WebKitGTK on Linux (libwebkit2gtk-4.1-dev), WebView2 on Windows. Folding
# it into `gui` would make the windowed build stop working on machines that
# have no webview runtime, to add a module they may never open.
webview = ["gui", "dep:wry", "dep:gtk"]

# Installers (`cargo packager --release` from this directory, or
# tools/package.sh): .deb and AppImage on Linux, an NSIS installer on Windows,
# a .dmg on macOS. The window build is what is packaged.
[package.metadata.packager]
product-name = "nimadir"
identifier = "dev.nimadir.shell"
description = "A native shell for sandboxed WebAssembly mini-apps"
long-description = "nimadir loads small apps compiled to WebAssembly components, runs each in a sandbox, and draws its interface natively, with no web stack in between. It opens on a store of apps from its registry; an app can keep its own data and reach the network only where its manifest says and the user allows."
homepage = "https://github.com/Nodirbek-Abdulaxadov/nimadir"
authors = ["Nodirbek Abdulaxadov"]
publisher = "Nodirbek Abdulaxadov"
license-file = "../LICENSE"
category = "Utility"
before-packaging-command = "cargo build --release -p host --features gui"
out-dir = "../target/release"
binaries = [{ path = "nimadir-shell", main = true }]
icons = ["assets/icons/32x32.png", "assets/icons/128x128.png", "assets/icons/256x256.png", "assets/icons/512x512.png"]
formats = ["deb", "appimage", "nsis", "dmg"]

# What winit and wgpu load at run time: a keyboard map, X11 or Wayland, and
# Vulkan (or GL, which wgpu falls back to).
[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libwayland-client0", "libx11-6", "libxcursor1", "libxrandr2", "libxi6", "libvulkan1 | libgl1"]
