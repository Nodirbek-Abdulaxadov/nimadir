[package]
name = "nimadir-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "The nimadir developer tool: make, build, check, sign and run mini-apps"

[[bin]]
name = "nimadir"
path = "src/main.rs"

[dependencies]
anyhow = "1"
nimadir-manifest = { path = "../../crates/manifest" }
serde_json = "1"
getrandom = "0.3"
