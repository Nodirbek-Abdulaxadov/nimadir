[workspace]
resolver = "2"
members = ["host", "tools/componentize", "tools/nimadir-pack", "crates/manifest", "android"]
# `android` is built for an Android target by android/build.sh; a plain
# `cargo build` leaves it out.
default-members = ["host", "tools/componentize", "tools/nimadir-pack", "crates/manifest"]
# Mini-apps compile to `wasm32-unknown-unknown` and are turned into WASM
# components; they import host functions that only exist at runtime, so they must
# NOT be built for the native host target. They are standalone crates, excluded
# from the workspace and built separately (see build-mini-apps.sh).
exclude = ["mini-apps/counter", "mini-apps/hello", "mini-apps/store", "mini-apps/runaway", "mini-apps/future", "mini-apps/gallery", "mini-apps/fetcher", "mini-apps/rates", "mini-apps/fuzz"]
