# Builds every installer for a version tag (v1.0.0-beta.1, …) and attaches
# them to a *draft* GitHub release — published by hand, after a look.
#
# Signing is optional and comes from secrets when they exist:
#   macOS   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#           APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (notarisation) — read by
#           cargo-packager. Without them the .dmg is unsigned and Gatekeeper
#           will refuse to open it without a right-click.
#   Android NIMADIR_KEYSTORE_BASE64 + NIMADIR_KEYSTORE_PASSWORD. Without them
#           the AAB is unsigned, for Play App Signing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb
          - os: windows-latest
            formats: nsis
          - os: macos-latest
            formats: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked
      # The store is baked into the shell, so it has to exist first.
      - run: ./build-mini-apps.sh
      - working-directory: host
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo packager --release -f ${{ matrix.formats }}
      # AppImage on its own: linuxdeploy has failed on some build machines
      # where the .deb is fine (docs/ROADMAP.md, S8-1). Its failure must not
      # cost the release its other installers.
      - if: runner.os == 'Linux'
        id: appimage
        continue-on-error: true
        working-directory: host
        run: cargo packager --release -f appimage
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/*.deb
            target/release/*.AppImage
            target/release/*-setup.exe
            target/release/*.dmg

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - run: ./build-mini-apps.sh
      - name: Release keystore, if the repository has one
        env:
          KEYSTORE: ${{ secrets.NIMADIR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NIMADIR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - run: ./android/build.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          NIMADIR_KEYSTORE_PASSWORD: ${{ secrets.NIMADIR_KEYSTORE_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
