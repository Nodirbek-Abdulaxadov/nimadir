[package]
name = "nimadir-android"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Android front door onto the nimadir shell"

# Android loads the app as a shared library and calls its `android_main`.
# Packaged by the Gradle project in this directory — see build.sh.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# Everything is Android-only: on the desktop this crate compiles to nothing.
[target.'cfg(target_os = "android")'.dependencies]
host = { path = "../host", features = ["gui"] }
anyhow = "1"
log = "0.4"
android_logger = "0.15"
